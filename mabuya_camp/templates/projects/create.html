{% extends "base.html" %}
{% block title %}New Project — Mabuya Camp{% endblock %}

{% block content %}
<a href="{{ url_for('home.index') }}" class="back-link"><i class="bi bi-arrow-left"></i> Cancel</a>
<div class="mc-panel" style="max-width: 640px;">
    <h1 class="mc-greeting mb-3" style="font-size: 1.75rem;">Create Project</h1>
    <form method="post" action="{{ url_for('projects.create') }}">
        <div class="mb-3">
            <label class="form-label mc-form-label" for="name">Project name *</label>
            <input type="text" class="form-control mc-form-control" id="name" name="name" required maxlength="200" value="{{ form.get('name', '') if form else '' }}" autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label mc-form-label" for="description">Description</label>
            <textarea class="form-control mc-form-control" id="description" name="description" rows="3">{{ form.get('description', '') if form else '' }}</textarea>
        </div>
        <div class="mb-3">
            <label class="form-label mc-form-label d-block">Project colour</label>
            <div class="color-options">
                {% for key, hex in colors.items() %}
                <label class="color-option" title="{{ key|capitalize }}">
                    <input type="radio" name="color" value="{{ key }}" {% if (form.get('color') if form else 'teal') == key %}checked{% endif %}>
                    <span class="color-swatch" style="background: {{ hex }};"></span>
                </label>
                {% endfor %}
            </div>
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <label class="form-label mc-form-label" for="start_date">Start date</label>
                <input type="date" class="form-control mc-form-control" id="start_date" name="start_date" value="{{ form.get('start_date', '') if form else '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label mc-form-label" for="end_date">End date</label>
                <input type="date" class="form-control mc-form-control" id="end_date" name="end_date" value="{{ form.get('end_date', '') if form else '' }}">
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-between">
            <a href="{{ url_for('home.index') }}" class="btn mc-btn mc-btn-ghost">Cancel</a>
            <button type="submit" class="btn mc-btn mc-btn-primary">Create Project</button>
        </div>
    </form>
</div>
{% endblock %}
